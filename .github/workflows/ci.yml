# Gates dev the way deploy-pages.yml gates main: typecheck, lint, unit
# tests, and a production export build, so a broken dev never gets to
# GitHub Pages in the first place. Runs on every push to dev and on any
# PR targeting dev or main.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags needed by `bun run check-version`

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # honors the packageManager pin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package version
        run: bun run check-version

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build (static export, mirrors deploy)
        run: bun run build
        env:
          NEXT_OUTPUT_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /wright-angles
