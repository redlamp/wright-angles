# Deploys the static export to GitHub Pages. Three slots in one artifact:
#   /wright-angles          main (production)
#   /wright-angles/dev      dev (best-effort — a broken dev never blocks main)
#   /wright-angles/preview  a work branch, for checking work before it merges
# Every run rebuilds all three from branch heads, so any run redeploys
# main unchanged and a newer run cancelling an older one loses nothing.
# The preview is the head of the most recently updated open PR into dev.
# Only dev and main pushes run this: the github-pages environment allows
# only those two branches, so a work-branch push would be refused at the
# deploy step (seen 2026-10-14 and 2026-10-17). Work branches stay off
# Pages until they are merged.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # to find the newest open PR for the preview slot
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main # a dev push must not build dev into the main slot
          fetch-depth: 0 # tags needed by `bun run check-version`

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # honors the packageManager pin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package version
        run: bun run check-version

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build main slot
        run: bun run build
        env:
          NEXT_OUTPUT_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /wright-angles

      - name: Stage main slot
        run: |
          mkdir -p site
          cp -r out/* site/

      - name: Checkout dev
        id: dev-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Build dev slot
        id: dev-build
        continue-on-error: true
        if: steps.dev-checkout.outcome == 'success'
        working-directory: dev-src
        run: |
          bun install --frozen-lockfile
          NEXT_OUTPUT_EXPORT=1 NEXT_PUBLIC_BASE_PATH=/wright-angles/dev bun run build
          mkdir -p ../site/dev
          cp -r out/* ../site/dev/

      - name: Pick preview branch
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHED: ${{ github.ref_name }}
        run: |
          case "$PUSHED" in
            main|dev)
              branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --base dev \
                --state open --json headRefName,updatedAt \
                --jq 'sort_by(.updatedAt) | last | .headRefName // ""')
              ;;
            *) branch="$PUSHED" ;;
          esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "Preview slot: ${branch:-none}"

      - name: Checkout preview
        id: preview-checkout
        if: steps.preview.outputs.branch != ''
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.preview.outputs.branch }}
          path: preview-src

      - name: Build preview slot
        continue-on-error: true
        if: steps.preview-checkout.outcome == 'success'
        working-directory: preview-src
        env:
          PREVIEW_BRANCH: ${{ steps.preview.outputs.branch }}
        run: |
          bun install --frozen-lockfile
          NEXT_OUTPUT_EXPORT=1 NEXT_PUBLIC_BASE_PATH=/wright-angles/preview bun run build
          mkdir -p ../site/preview
          cp -r out/* ../site/preview/
          printf '%s\n' "$PREVIEW_BRANCH" > ../site/preview/BRANCH.txt

      - name: Finalize artifact
        run: touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
